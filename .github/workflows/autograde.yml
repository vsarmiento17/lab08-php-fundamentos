name: Autograde Lab 8

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      registrar:
        description: "Registrar la nota oficial en Supabase"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  autograde:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # necesario para analizar el historial de commits

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, tokenizer
          tools: none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cliente MySQL
        run: command -v mysql || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Ejecutar autograde
        env:
          # La nota solo se registra en Supabase cuando el último commit lleva [E4]
          # (o si se lanza manualmente con registrar = true). Los demás pushes son "práctica".
          REGISTRAR: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[E4]')) || (github.event_name == 'workflow_dispatch' && inputs.registrar) }}
        run: python autograde/autograde.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-autograde
          path: resultado.json
